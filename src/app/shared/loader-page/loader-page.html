<div class="loader-overlay" [style.background-color]="backgroundColor">
    <div class="loader-container">
        <div class="loader-content">
            <!-- Logo or Icon -->
            @if (showLogo) {
            <div class="logo-section">
                <mat-icon class="logo-icon">{{ icon }}</mat-icon>
            </div>
            }

            <!-- Loading Message -->
            <div class="message-section">
                <h2 class="loading-title">{{ message }}</h2>
                <div class="loading-dots">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>

            <!-- Additional loading text -->
            <p class="loading-subtitle">Por favor, espera un momento...</p>
        </div>
    </div>
</div>
