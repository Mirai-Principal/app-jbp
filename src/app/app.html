@if (isAuthenticated()) {
<div class="main-layout" [class.sidebar-collapsed]="sidebarState.collapsed()">
    <app-side-bar-menu />
    <main class="content">
        <router-outlet />
    </main>
</div>
} @else {
<div class="main-layout">
    <main class="content content-full">
        <router-outlet />
    </main>
</div>
}
