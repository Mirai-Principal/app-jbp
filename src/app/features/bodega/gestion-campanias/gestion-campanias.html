@if (isLoading()) {
<app-loader-page message="Cargando campañas de pesaje..." icon="sync" />
}
<app-header title="Gestión de Campañas de Pesaje" icon="scale" />
<div class="container">
    <mat-card>
        <mat-card-content>
            <div class="header-actions">
                <mat-form-field appearance="outline" class="search-field">
                    <mat-label>Buscar por nombre o Num. OF</mat-label>
                    <input matInput [formControl]="searchControl" placeholder="Ej: Enero 2026, 1000123" />
                    <mat-icon matSuffix style="cursor: pointer">search</mat-icon>
                </mat-form-field>
                
                <button mat-raised-button color="primary" class="btn-premium" (click)="openModal()">
                    <mat-icon>add</mat-icon>
                    Nueva Campaña
                </button>
            </div>

            <ng-template #customCell let-column="column" let-element="element">
                @if (column.columnDef === 'Id') {
                <button mat-icon-button class="btn-icon-primary" (click)="accionesDetalles(element)"
                    title="Ver Detalles">
                    <mat-icon>visibility</mat-icon>
                </button>
                } @else {
                {{ column.cell ? column.cell(element) : element[column.columnDef] }}
                }
            </ng-template>

            <div class="table-container">
                <app-table [data]="campanias()" [columns]="columns" [displayedColumns]="displayedColumns"
                    [showPaginator]="true" [cellTemplate]="customCell">
                </app-table>
            </div>
        </mat-card-content>
    </mat-card>
</div>

<!-- Modal para Nueva Campaña -->
<app-modal [isOpen]="isModalOpen()" title="Nueva Campaña de Pesaje" maxWidth="1200px" (close)="closeModal()"
    (backdropClick)="closeModal()">
    <app-generar-pesaje-campania></app-generar-pesaje-campania>
</app-modal>

<!-- Modal para Detalles Campaña -->
<app-modal [isOpen]="isDetallesModalOpen()"
    [title]="'Detalles de la Campaña: ' + (campaniaSeleccionada()?.NOMBRE || '')" maxWidth="1000px"
    (close)="closeDetallesModal()" (backdropClick)="closeDetallesModal()">
    @if (campaniaSeleccionada()) {
    <app-detalles-campania [campania]="campaniaSeleccionada()!"
        (campaniaEliminada)="onCampaniaEliminada()"></app-detalles-campania>
    }
</app-modal>
