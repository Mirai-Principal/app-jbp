<app-header title="Actualizar Monto Cuentas" icon="account_balance" />
<div class="container">
    <mat-card>
        <mat-card-header>
            <mat-card-title class="card-title">
                no responde los endpoints
            </mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="form" fxLayout="column">

                <mat-form-field appearance="outline">
                    <mat-label>Período</mat-label>

                    <input type="text" matInput formControlName="Periodo" [matAutocomplete]="auto" />

                    <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayPeriodo" autoActiveFirstOption>
                        @for (item of filteredPeriodo | async; track $index) {
                        <mat-option [value]="item">
                            {{ item.Nombre }}
                        </mat-option>
                        }
                    </mat-autocomplete>

                    @if (form.get('Periodo')?.hasError('required')) {
                    <mat-error>
                        Debe seleccionar el período
                    </mat-error>
                    }

                </mat-form-field>

                <button mat-raised-button color="primary" (click)="procesar()" [disabled]="form.invalid">
                    Guardar
                </button>

            </form>
        </mat-card-content>
    </mat-card>
</div>
