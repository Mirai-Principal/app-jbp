<div class="unauthorized-container">
    <div class="unauthorized-card">
        <div class="unauthorized-illustration">
            <mat-icon class="unauthorized-icon">gpp_bad</mat-icon>
            <div class="unauthorized-code">403</div>
        </div>

        <div class="unauthorized-content">
            <h1 class="unauthorized-title">Acceso Denegado</h1>
            <p class="unauthorized-description">
                No tienes los permisos necesarios para acceder a esta sección.
            </p>
            <p class="unauthorized-subtitle">
                Por favor, verifica con el administrador si necesitas solicitar acceso.
            </p>

            <div class="unauthorized-actions">
                <button mat-raised-button color="primary" routerLink="/" class="home-btn">
                    <mat-icon>home</mat-icon>
                    Volver al inicio
                </button>
            </div>
        </div>
        <div class="unauthorized-footer">
            <p class="footer-text">
                Si crees que esto es un error, contacta al departamento de TICS.
            </p>
        </div>
    </div>
</div>
