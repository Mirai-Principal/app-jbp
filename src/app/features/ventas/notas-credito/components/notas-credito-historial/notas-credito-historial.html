@if (procesando()) {
<app-loader-page message="Consultando documentos..." icon="sync" />
}

<app-header title="Historial de Notas de Crédito Manuales" icon="history" />
<div class="container">
    <mat-card>

        <mat-card-content>
            <div class="header-filters">
                <form [formGroup]="fechaForm" class="date-form">
                    <mat-form-field appearance="outline" class="date-field">
                        <mat-label>Seleccionar Fecha</mat-label>
                        <input matInput [matDatepicker]="picker" formControlName="fecha" [max]="today()"
                            [min]="'2000-01-02'">
                        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                </form>

                @if (rucs().length > 0) {
                <div class="divider"></div>
                <mat-form-field appearance="outline" class="filter-field">
                    <mat-label>Filtrar por RUC</mat-label>
                    <mat-icon matPrefix class="filter-icon-prefix">filter_list</mat-icon>
                    <mat-select [value]="filtroActivo()" (selectionChange)="onFiltroRucChange($event.value)">
                        <mat-option [value]="null">Todos</mat-option>
                        @for (ruc of rucs(); track ruc) {
                        <mat-option [value]="ruc">{{ ruc }}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>
                }
            </div>

            <app-documentos-enviados />
        </mat-card-content>
    </mat-card>
</div>
